# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - model: dti_model # fixed for web server version
  - task: default
  - data: dti_data # fixed for web server version
  - callbacks: default
  - logger: csv
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default

  - _self_

  - local: null
  - preset: null
  # Sweeping config, for batch experiments, hyperparameter optimization, etc.
  - sweep: null
  # Debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

# job name, determines output directory path
job_name: "train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ???

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
# test: True

# compile model for faster training (PyTorch experimental)
compile: False
finetune: null

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in torch, numpy and python.random
seed: 12345

trainer:
  check_val_every_n_epoch: 1
  limit_val_batches: ${eval:'1.0 if ${oc.select:data.train_val_test_split} and ${oc.select:data.train_val_test_split}[1] else 0'}
  num_sanity_val_steps: ${eval:'2 if ${oc.select:data.train_val_test_split} and ${oc.select:data.train_val_test_split}[1] else 0'}
