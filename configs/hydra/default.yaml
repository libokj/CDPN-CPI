defaults:
  - override callbacks: default
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output path formatting
run:
  dir: ${paths.log_dir}/${job_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}_${eval:'",".join(${tags})'}
sweep:
  dir: ${paths.log_dir}/${job_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}_${eval:'",".join(${tags})'}
  # Sanitize override_dirname by replacing unsafe characters to avoid unintended subdirectory creation
  subdir: ${sanitize_path:'${hydra:job.id}-${hydra:job.override_dirname}'}

job_logging:
  handlers:
    file:
      filename: ${hydra:runtime.output_dir}/${hydra.job.name}.log

job:
  config:
    override_dirname:
      kv_sep: '='
      item_sep: ','
      exclude_keys: [
        'tags', 'sweep', 'trainer', 'data.data_file', 'data.data_dir', 'data.train_val_test_split', 'ckpt_path'
      ]
